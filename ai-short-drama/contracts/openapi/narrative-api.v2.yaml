openapi: 3.1.0
info:
  title: AI Short Drama Narrative API
  version: 2.1.0-phase2
  description: >-
    Frozen Phase 1 public contract for the source library, Narrative IR,
    Adaptation Spec, compiler operations and lineage. Phase 1 defines storage
    and contracts only; handlers are implemented in later phases. Existing
    /api/v1 endpoints remain unchanged.
servers:
  - url: /api/v2
security:
  - bearerAuth: []
tags:
  - name: SourceWorks
    description: Reusable source-library works independent of adaptation projects.
  - name: SourceVersions
    description: Immutable published source snapshots and chapter revisions.
  - name: AdaptationProjects
    description: Project bindings, adaptation specifications and compiler inputs.
  - name: Operations
    description: Retryable asynchronous operations and worker lease protocol.
  - name: Lineage
    description: Artifact provenance, dependency and impact views.
  - name: IRMerge
    description: Human-reviewed Incremental IR to immutable published Full IR merge proposals.
paths:
  /source-works:
    get:
      tags: [SourceWorks]
      operationId: listSourceWorks
      summary: List source works
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema: {type: string, maxLength: 200}
      responses:
        '200':
          description: Source works
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceWorkListResponse'
    post:
      tags: [SourceWorks]
      operationId: createSourceWork
      summary: Create a source work
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceWorkRequest'
      responses:
        '201':
          description: Created source work
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceWorkResponse'
        '409': {$ref: '#/components/responses/Conflict'}
  /source-works/{work_id}:
    get:
      tags: [SourceWorks]
      operationId: getSourceWork
      summary: Get a source work
      parameters:
        - $ref: '#/components/parameters/WorkID'
      responses:
        '200':
          description: Source work
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceWorkResponse'
        '404': {$ref: '#/components/responses/NotFound'}
  /source-works/{work_id}/versions:
    get:
      tags: [SourceVersions]
      operationId: listSourceVersions
      summary: List source versions
      parameters:
        - $ref: '#/components/parameters/WorkID'
      responses:
        '200':
          description: Version list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [contract_version, trace_id, data]
                properties:
                  contract_version: {type: string, const: '2.0'}
                  trace_id: {$ref: '#/components/schemas/ID'}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/SourceVersion'}
    post:
      tags: [SourceVersions]
      operationId: createSourceVersion
      summary: Create a draft source version
      parameters:
        - $ref: '#/components/parameters/WorkID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceVersionRequest'
      responses:
        '201':
          description: Draft version created
          headers:
            ETag: {$ref: '#/components/headers/ResourceETag'}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [contract_version, trace_id, data]
                properties:
                  contract_version: {type: string, const: '2.0'}
                  trace_id: {$ref: '#/components/schemas/ID'}
                  data: {$ref: '#/components/schemas/SourceVersion'}
        '409': {$ref: '#/components/responses/Conflict'}
  /source-versions/{source_version_id}:
    get:
      tags: [SourceVersions]
      operationId: getSourceVersion
      summary: Get a source version
      parameters:
        - $ref: '#/components/parameters/SourceVersionID'
      responses:
        '200':
          description: Version detail
          headers:
            ETag: {$ref: '#/components/headers/ResourceETag'}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [contract_version, trace_id, data]
                properties:
                  contract_version: {type: string, const: '2.0'}
                  trace_id: {$ref: '#/components/schemas/ID'}
                  data: {$ref: '#/components/schemas/SourceVersion'}
        '404': {$ref: '#/components/responses/NotFound'}
  /source-versions/{source_version_id}/imports:
    post:
      tags: [SourceVersions]
      operationId: startSourceImport
      summary: Start a retryable source import
      parameters:
        - $ref: '#/components/parameters/SourceVersionID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartImportRequest'
      responses:
        '202':
          description: Import accepted
          headers:
            ETag: {$ref: '#/components/headers/ResourceETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
  /source-versions/{source_version_id}/chapters:
    get:
      tags: [SourceVersions]
      operationId: listVersionChapters
      summary: List ordered version chapters
      parameters:
        - $ref: '#/components/parameters/SourceVersionID'
      responses:
        '200':
          description: Ordered chapters
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [contract_version, trace_id, data]
                properties:
                  contract_version: {type: string, const: '2.0'}
                  trace_id: {$ref: '#/components/schemas/ID'}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/ChapterRevision'}
    post:
      tags: [SourceVersions]
      operationId: addChapter
      summary: Add one chapter to a draft version
      parameters:
        - $ref: '#/components/parameters/SourceVersionID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChapterInput'}
      responses:
        '202':
          description: Chapter command accepted
          headers:
            ETag: {$ref: '#/components/headers/ResourceETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
  /source-versions/{source_version_id}/chapters:batch:
    post:
      tags: [SourceVersions]
      operationId: addChaptersBatch
      summary: Add chapters to a draft version in batch
      parameters:
        - $ref: '#/components/parameters/SourceVersionID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: {$ref: '#/components/schemas/ChapterInput'}
      responses:
        '202':
          description: Batch accepted
          headers:
            ETag: {$ref: '#/components/headers/ResourceETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationResponse'}
  /source-chapters/{chapter_id}/revisions:
    get:
      tags: [SourceVersions]
      operationId: listChapterRevisions
      summary: List immutable revision history for one logical chapter
      parameters:
        - $ref: '#/components/parameters/ChapterID'
      responses:
        '200':
          description: Revision history, newest first, without full chapter bodies
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [contract_version, trace_id, data]
                properties:
                  contract_version: {type: string, const: '2.0'}
                  trace_id: {$ref: '#/components/schemas/ID'}
                  data: {type: array, items: {$ref: '#/components/schemas/ChapterRevisionHistoryItem'}}
        '404': {$ref: '#/components/responses/NotFound'}
  /source-versions/{source_version_id}/chapters/{chapter_id}:
    patch:
      tags: [SourceVersions]
      operationId: reviseChapter
      summary: Add a chapter revision to a draft version
      parameters:
        - $ref: '#/components/parameters/SourceVersionID'
        - $ref: '#/components/parameters/ChapterID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, content]
              properties:
                title: {type: string, minLength: 1, maxLength: 1000}
                content: {type: string, minLength: 1}
      responses:
        '202':
          description: Revision accepted
          headers:
            ETag: {$ref: '#/components/headers/ResourceETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
  /source-versions/{source_version_id}:publish:
    post:
      tags: [SourceVersions]
      operationId: publishSourceVersion
      summary: Publish and seal a source version
      parameters:
        - $ref: '#/components/parameters/SourceVersionID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '202':
          description: Publish accepted
          headers:
            ETag: {$ref: '#/components/headers/ResourceETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
  /source-versions/{source_version_id}/ir-runs:
    post:
      tags: [SourceVersions]
      operationId: startNarrativeIRRun
      summary: Start bounded Narrative IR extraction
      x-implementation-phase: 3
      parameters:
        - $ref: '#/components/parameters/SourceVersionID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, extractor_version]
              properties:
                schema_version: {type: string, const: narrative-extraction.v1}
                extractor_version: {type: string, minLength: 1, maxLength: 200}
                chapter_ids:
                  type: array
                  uniqueItems: true
                  items: {$ref: '#/components/schemas/ID'}
      responses:
        '202':
          description: IR extraction accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationResponse'}
  /source-versions/{source_version_id}/ir-revisions:
    get:
      tags: [SourceVersions]
      operationId: listNarrativeIRRevisions
      summary: List Narrative IR extraction status for a source version
      parameters:
        - $ref: '#/components/parameters/SourceVersionID'
      responses:
        '200':
          description: IR revision summaries
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [contract_version, trace_id, data]
                properties:
                  contract_version: {type: string, const: '2.0'}
                  trace_id: {$ref: '#/components/schemas/ID'}
                  data: {type: array, items: {$ref: '#/components/schemas/NarrativeIRRevisionSummary'}}
  /narrative-ir-revisions/{ir_revision_id}/story-arcs:
    get:
      tags: [SourceVersions]
      operationId: listNarrativeIRStoryArcs
      summary: List reviewable story arcs from a published IR revision
      parameters:
        - name: ir_revision_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ID'}
      responses:
        '200':
          description: Story arcs with exact source chapter identity
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [contract_version, trace_id, data]
                properties:
                  contract_version: {type: string, const: '2.0'}
                  trace_id: {$ref: '#/components/schemas/ID'}
                  data: {type: array, items: {$ref: '#/components/schemas/StoryArcSummary'}}
  /narrative-ir-merge-proposals:
    post:
      tags: [IRMerge]
      operationId: createIRMergeProposal
      summary: Materialize a reviewable diff between a published full IR and its published incremental IR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [base_full_ir_revision_id, incremental_ir_revision_id]
              properties:
                base_full_ir_revision_id: {$ref: '#/components/schemas/ID'}
                incremental_ir_revision_id: {$ref: '#/components/schemas/ID'}
                created_by: {type: string, maxLength: 500}
      responses:
        '201':
          description: Merge proposal created; no full IR was published
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IRMergeProposalResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
  /narrative-ir-merge-proposals/{proposal_id}:
    get:
      tags: [IRMerge]
      operationId: getIRMergeProposal
      summary: Compare IR versions with filtered diff items and side-by-side source evidence
      parameters:
        - name: proposal_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ID'}
        - name: item_type
          in: query
          schema: {type: string, enum: [entity, fact, event, relation, state, foreshadow, story_arc]}
        - name: change_type
          in: query
          schema: {type: string, enum: [added, modified, deleted, relocated, unchanged, conflict]}
        - name: resolution_status
          in: query
          schema: {type: string, enum: [unresolved, resolved, needs_manual_edit]}
      responses:
        '200':
          description: Proposal, diff items, evidence and impact preview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IRMergeProposalResponse'}
  /narrative-ir-merge-proposals/{proposal_id}/items/{item_id}:
    patch:
      tags: [IRMerge]
      operationId: resolveIRMergeItem
      summary: Resolve one conflict without mutating either input IR
      parameters:
        - name: proposal_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ID'}
        - name: item_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IRMergeResolutionRequest'}
      responses:
        '200':
          description: Conflict decision recorded
        '409': {$ref: '#/components/responses/Conflict'}
  /narrative-ir-merge-proposals/{proposal_id}/publish:
    post:
      tags: [IRMerge]
      operationId: publishIRMergeProposal
      summary: Atomically create and publish one immutable full IR snapshot
      parameters:
        - name: proposal_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ID'}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmed]
              properties:
                confirmed: {type: boolean, const: true}
                published_by: {type: string, maxLength: 500}
      responses:
        '201':
          description: Full IR published and authoritative impact scan queued; no downstream rebuild was started
        '409': {$ref: '#/components/responses/Conflict'}
  /adaptation-projects:
    post:
      tags: [AdaptationProjects]
      operationId: createAdaptationProject
      summary: Create an adaptation project from an existing source version
      x-implementation-phase: 4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdaptationProjectRequest'
      responses:
        '202':
          description: Project creation accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
  /adaptation-projects/{project_id}/specs:
    get:
      tags: [AdaptationProjects]
      operationId: listAdaptationSpecs
      summary: List adaptation specification versions
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: Spec summaries
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [contract_version, trace_id, data]
                properties:
                  contract_version: {type: string, const: '2.0'}
                  trace_id: {$ref: '#/components/schemas/ID'}
                  data: {type: array, items: {$ref: '#/components/schemas/AdaptationSpecSummary'}}
    post:
      tags: [AdaptationProjects]
      operationId: createAdaptationSpecVersion
      summary: Disabled direct successor write; use the unified change-plan API
      deprecated: true
      x-implementation-phase: 4
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../json-schema/adaptation-spec.v1.json
      responses:
        '410':
          description: Direct formal-content mutation is disabled; preview, confirm and execute a change plan
  /adaptation-projects/{project_id}/compiler-runs:
    post:
      tags: [AdaptationProjects]
      operationId: startCompilerRun
      summary: Compile a validated adaptation plan
      x-implementation-phase: 3
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [adaptation_spec_version_id, ir_revision_id, compiler_version]
              properties:
                adaptation_spec_version_id: {$ref: '#/components/schemas/ID'}
                ir_revision_id: {$ref: '#/components/schemas/ID'}
                compiler_version: {type: string, minLength: 1, maxLength: 200}
                planning_constraints: {type: object}
                provider_suggestions:
                  type: array
                  maxItems: 1000
                  items: {type: object}
      responses:
        '202':
          description: Compiler run accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationResponse'}
  /adaptation-projects/{project_id}/adaptation-plans:
    get:
      tags: [AdaptationProjects]
      operationId: listSeasonPlans
      summary: List immutable whole-season alternatives for comparison
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: Whole-season plan summaries ordered by version
  /adaptation-projects/{project_id}/adaptation-plans/latest:
    get:
      tags: [AdaptationProjects]
      operationId: getLatestAdaptationPlan
      summary: Get the latest whole-season adaptation plan version
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: Latest whole-season plan
  /adaptation-plans/{adaptation_plan_id}:
    get:
      tags: [AdaptationProjects]
      operationId: getAdaptationPlan
      summary: Get a reviewable compiler plan with source and deviation audit fields
      x-implementation-phase: 3
      parameters:
        - name: adaptation_plan_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ID'}
      responses:
        '200':
          description: Reviewable compiler plan
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [contract_version, trace_id, data]
                properties:
                  contract_version: {type: string, const: '2.0'}
                  trace_id: {$ref: '#/components/schemas/ID'}
                  data:
                    $ref: ../json-schema/compiler-plan.v2.json
        '404': {$ref: '#/components/responses/NotFound'}
  /adaptation-plans/{adaptation_plan_id}/validate:
    post:
      tags: [AdaptationProjects]
      operationId: validateSeasonPlanDraft
      summary: Revalidate a workbench operation against hard and soft rules without persisting it
      parameters:
        - name: adaptation_plan_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SeasonPlanDraft'}
      responses:
        '200':
          description: Deterministic validation result grouped by hard and soft violations
  /adaptation-plans/{adaptation_plan_id}/versions:
    post:
      tags: [AdaptationProjects]
      operationId: createSeasonPlanVersion
      summary: Save edits as an immutable successor; never overwrite the reviewed or approved plan
      parameters:
        - name: adaptation_plan_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ID'}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SeasonPlanDraft'}
      responses:
        '201':
          description: New waiting-review adaptation plan version
        '409': {$ref: '#/components/responses/Conflict'}
  /adaptation-plans/{adaptation_plan_id}/approve:
    post:
      tags: [AdaptationProjects]
      operationId: approveSeasonPlan
      summary: Rerun causal, character-state, foreshadow, duration and rule gates, then approve without creating a queue
      parameters:
        - name: adaptation_plan_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ID'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                approved_by: {type: string, maxLength: 500}
      responses:
        '200':
          description: Plan approved; queue_created is always false
        '422':
          description: Approval validation failed with complete diagnostics
  /adaptation-projects/{project_id}/impact:
    get:
      tags: [Lineage]
      operationId: getProjectImpact
      summary: Preview project impact for a source-version change
      x-implementation-phase: 4
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - name: to_source_version_id
          in: query
          required: true
          schema: {$ref: '#/components/schemas/ID'}
      responses:
        '200':
          description: Read-only impact preview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImpactResponse'}
  /adaptation-projects/{project_id}/impact/{source_change_set_id}/regeneration-requests:
    post:
      tags: [Lineage]
      operationId: createRegenerationRequest
      summary: Record the user's explicit decision to regenerate selected stale artifacts
      description: This command queues a decision record only; it never deletes or overwrites an approved artifact.
      x-implementation-phase: 4
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - name: source_change_set_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ID'}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [strategy, artifact_ids]
              properties:
                strategy: {type: string, enum: [selective, full_recompile]}
                artifact_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  uniqueItems: true
                  items: {$ref: '#/components/schemas/ID'}
                requested_by: {type: string, minLength: 1, maxLength: 200}
      responses:
        '201':
          description: Regeneration decision recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegenerationRequestResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
  /operations/{operation_id}:
    get:
      tags: [Operations]
      operationId: getOperation
      summary: Get asynchronous operation state
      parameters:
        - name: operation_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ID'}
      responses:
        '200':
          description: Operation state and checkpoint
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /operations:claim:
    post:
      tags: [Operations]
      operationId: claimOperation
      summary: Atomically claim the next worker operation
      x-internal-worker-operation: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClaimOperationRequest'}
      responses:
        '200':
          description: Atomically claimed operation; claim_token must be used for heartbeat and completion.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClaimedOperationResponse'}
        '204': {description: No claimable operation}
  /operations/{operation_id}:heartbeat:
    post:
      tags: [Operations]
      operationId: heartbeatOperation
      summary: Extend a current operation lease
      x-internal-worker-operation: true
      parameters:
        - name: operation_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ID'}
        - $ref: '#/components/parameters/ClaimToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lease_seconds]
              properties:
                lease_seconds: {type: integer, minimum: 1, maximum: 3600}
      responses:
        '200':
          description: Lease extended only when the claim token is current and unexpired.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
  /operations/{operation_id}:checkpoint:
    post:
      tags: [Operations]
      operationId: checkpointOperation
      summary: Commit a token-fenced operation checkpoint
      x-internal-worker-operation: true
      description: >-
        The handler calls assert_operation_claim and writes checkpoint/domain rows
        in one database transaction. A stale or expired token returns 409.
      parameters:
        - name: operation_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ID'}
        - $ref: '#/components/parameters/ClaimToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckpointOperationRequest'}
      responses:
        '200':
          description: Checkpoint committed under the current lease.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
  /operations/{operation_id}:finish:
    post:
      tags: [Operations]
      operationId: finishOperation
      summary: Commit a token-fenced terminal operation result
      x-internal-worker-operation: true
      description: >-
        The terminal operation transition and all domain-result publication must
        occur in the same transaction after assert_operation_claim locks the row.
      parameters:
        - name: operation_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ID'}
        - $ref: '#/components/parameters/ClaimToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FinishOperationRequest'}
      responses:
        '200':
          description: Terminal result committed under the current lease.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
