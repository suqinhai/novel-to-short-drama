components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  headers:
    ResourceETag:
      description: Quoted integer resource_revision after the accepted mutation.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Stable request identifier. On /operations:claim it is persisted as
        claim_request_id, so a lost response can be retried without claiming a
        second operation.
      schema: {type: string, minLength: 8, maxLength: 512}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Quoted source_versions.resource_revision, for example "3". Every
        accepted command transaction reserves and increments the revision before
        returning 202, and returns the new value as ETag. Worker failure never
        decrements it; a mismatch returns 409 without enqueueing or writing.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    ClaimToken:
      name: X-Operation-Claim-Token
      in: header
      required: true
      schema: {type: string, format: uuid}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    WorkID:
      name: work_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ID'}
    SourceVersionID:
      name: source_version_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ID'}
    ChapterID:
      name: chapter_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ID'}
    ProjectID:
      name: project_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ID'}
    CandidateSetID:
      name: candidate_set_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ID'}
    CandidateID:
      name: candidate_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ID'}
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: Idempotency, immutable resource or revision conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    CreateChangePlanRequest:
      type: object
      additionalProperties: false
      required: [instruction, target]
      properties:
        instruction: {type: string, minLength: 1, maxLength: 5000}
        target: {$ref: '#/components/schemas/LocalEditTarget'}
        must_preserve: {type: array, uniqueItems: true, items: {type: string}}
        allowed_fields: {type: array, uniqueItems: true, items: {type: string}}
        changes: {type: array, items: {$ref: '#/components/schemas/PlannedFieldChange'}}
        rebuild_tasks:
          type: array
          uniqueItems: true
          items: {type: string, enum: [regenerate_voice, update_subtitle, regenerate_image, regenerate_video, recompose_timeline, update_continuity]}
        locks: {type: array, uniqueItems: true, items: {type: string, enum: [character, costume, location, composition]}}
        requested_by: {type: string, maxLength: 300}
    LocalEditTarget:
      type: object
      additionalProperties: false
      required: [entity_type, entity_id, version]
      properties:
        entity_type: {type: string, enum: [outline, script, episode_content, dialogue, scene, shot, shot_video, timeline, timeline_item, media]}
        entity_id: {$ref: '#/components/schemas/ID'}
        version: {type: integer, minimum: 1}
    PlannedFieldChange:
      type: object
      additionalProperties: false
      required: [operation]
      properties:
        operation: {type: string, enum: [replace, adjust, reorder, regenerate, regenerate_segment, manual_replace]}
        field: {type: string}
        value: {}
        delta: {}
        before: {}
        after: {}
        start_ms: {type: integer, minimum: 0}
        end_ms: {type: integer, minimum: 1}
    ChangePlan:
      type: object
      additionalProperties: false
      required: [schema_version, user_intent, target, must_preserve, allowed_fields, expected_changes, impact, rebuild, risks, validation_rules, rollback_version, change_kind, semantic_change, locks]
      properties:
        schema_version: {type: string, const: change-plan.v1}
        user_intent: {type: string}
        target: {$ref: '#/components/schemas/LocalEditTarget'}
        must_preserve: {type: array, items: {type: string}}
        allowed_fields: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
        expected_changes: {type: array, minItems: 1, items: {$ref: '#/components/schemas/PlannedFieldChange'}}
        impact:
          type: object
          required: [upstream, downstream, rebuild_tasks]
          properties:
            upstream: {type: array, items: {type: string}}
            downstream: {type: array, items: {type: string}}
            rebuild_tasks:
              type: array
              items: {type: string, enum: [regenerate_voice, update_subtitle, regenerate_image, regenerate_video, recompose_timeline, update_continuity]}
        rebuild:
          type: object
          required: [voice, image, video, edit, subtitle, continuity]
          properties:
            voice: {type: boolean}
            image: {type: boolean}
            video: {type: boolean}
            edit: {type: boolean}
            subtitle: {type: boolean}
            continuity: {type: boolean}
        risks: {type: array, items: {type: string}}
        validation_rules: {type: array, minItems: 1, items: {type: string}}
        rollback_version: {type: integer, minimum: 1}
        change_kind: {type: string, enum: [content_changed, removed, format_changed, source_relocated]}
        semantic_change: {type: boolean}
        locks: {type: array, items: {type: string, enum: [character, costume, location, composition]}}
    ChangePlanRecord:
      type: object
      additionalProperties: true
      required: [change_plan_id, project_id, status, plan, fingerprint, impacts, rebuild_tasks]
      properties:
        change_plan_id: {$ref: '#/components/schemas/ID'}
        project_id: {$ref: '#/components/schemas/ID'}
        status: {type: string, enum: [draft, validated, confirmed, executing, applied, failed, cancelled]}
        plan: {$ref: '#/components/schemas/ChangePlan'}
        fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
        impacts: {type: array, items: {type: object}}
        rebuild_tasks:
          type: array
          items:
            type: object
